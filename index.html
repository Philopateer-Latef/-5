<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(-45deg,#0f0c29,#302b63,#24243e,#000);
    background-size:400% 400%;
    animation:bg 10s ease infinite;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.circle{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    animation:float 8s infinite linear;
}

.circle:nth-child(1){
    width:200px;
    height:200px;
    top:10%;
    left:10%;
}

.circle:nth-child(2){
    width:150px;
    height:150px;
    bottom:10%;
    right:15%;
}

.circle:nth-child(3){
    width:100px;
    height:100px;
    top:70%;
    left:40%;
}

@keyframes float{
    0%{
        transform:translateY(0px) rotate(0deg);
    }
    50%{
        transform:translateY(-30px) rotate(180deg);
    }
    100%{
        transform:translateY(0px) rotate(360deg);
    }
}

.login-box{
    position:relative;
    width:350px;
    padding:40px;
    border-radius:25px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(12px);
    box-shadow:0 0 30px rgba(0,0,0,0.5);
    animation:show 1s ease;
}

@keyframes show{
    from{
        opacity:0;
        transform:translateY(50px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.login-box h2{
    color:white;
    text-align:center;
    margin-bottom:25px;
    font-size:32px;
}

.input-box{
    position:relative;
    margin-bottom:20px;
}

.input-box input{
    width:100%;
    padding:15px;
    border:none;
    outline:none;
    border-radius:15px;
    background:rgba(255,255,255,0.1);
    color:white;
    font-size:16px;
    transition:0.3s;
}

.input-box input:focus{
    background:rgba(255,255,255,0.2);
    transform:scale(1.03);
}

.input-box input::placeholder{
    color:#ddd;
}

/* زر العين */
.toggle{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    color:white;
    font-size:18px;
    user-select:none;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    background:linear-gradient(45deg,#00dbde,#fc00ff);
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
    font-weight:bold;
}

button:hover{
    transform:scale(1.05);
    box-shadow:0 0 20px #fc00ff;
}

#error{
    color:#ff7070;
    text-align:center;
    margin-top:15px;
}

</style>
</head>
<body>

<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

<div class="login-box">

    <h2>LOGIN</h2>

    <div class="input-box">
        <input type="text" id="username" placeholder="Username">
    </div>

    <div class="input-box">
        <input type="password" id="password" placeholder="Password">
        <span class="toggle" onclick="togglePassword()">👁</span>
    </div>

    <button onclick="login()">دخول</button>

    <p id="error"></p>

</div>

<script>

// إظهار وإخفاء الباسورد
function togglePassword(){

    let pass = document.getElementById("password");

    if(pass.type === "password"){
        pass.type = "text";
    }else{
        pass.type = "password";
    }

}

function login(){

    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    // بيانات تسجيل الدخول
    if(user === "Philo" && pass === "22122010"){

        // اللينك اللي انت هتحطه
        window.location.href = "https://philopateer-latef.github.io/-22/";

    }else{
        document.getElementById("error").innerHTML = "اسم المستخدم أو كلمة المرور غلط";
    }

}

</script>

</body>
</html>
